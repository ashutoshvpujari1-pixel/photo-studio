        // Dark mode toggle
        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
        }

        // Ambient Audio using Native Web Audio API (Reliable without external CDN dependencies)
        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioText');

            if (!isAudioPlaying) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }

                    // Pentatonic drone notes (Sa, Pa, Dha, Ni in Hz) e.g., 261.63 (C4), 392.00 (G4), 440.00 (A4), 523.25 (C5)
                    const frequencies = [261.63, 392.00, 440.00, 523.25, 587.33];

                    function playDroneNote() {
                        if (!isAudioPlaying || !audioCtx) return;
                        const freq = frequencies[Math.floor(Math.random() * frequencies.length)];
                        
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                        // Smooth envelope
                        gain.gain.setValueAtTime(0, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start();
                        osc.stop(audioCtx.currentTime + 5);
                    }

                    playDroneNote();
                    audioInterval = setInterval(playDroneNote, 3000);

                    isAudioPlaying = true;
                    icon.innerText = '🔇';
                    text.innerText = 'Mute Music';
                    btn.classList.add('bg-saffron-500', 'text-white');
                } catch(e) {
                    showToast('Audio playback could not be started.');
                }
            } else {
                if (audioInterval) clearInterval(audioInterval);
                if (audioCtx) {
                    audioCtx.close();
                    audioCtx = null;
                }
                isAudioPlaying = false;
                icon.innerText = '🎵';
                text.innerText = 'Ambient Music';
                btn.classList.remove('bg-saffron-500', 'text-white');
            }
        }

                                <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 flex items-center space-x-1.5">
                                    <span>🍲</span>
                                    <span>Famous Delicacies & Food</span>
                                </h4>
                                <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${state.food}</p>
                            </div>
                        </div>

                        <!-- Tourist Highlights -->
                        <div>
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">🌟 Must-Visit Landmarks</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${state.highlights.map(hl => `
                                    <div class="flex items-center space-x-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                                        <span class="text-saffron-500 font-bold">✦</span>
                                        <span class="text-sm font-semibold">${hl}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Navigation Footer inside Card -->
                        <div class="flex items-center justify-between pt-4 border-t border-slate-200 dark:border-slate-800">
                            <button onclick="navigateState(-1)" class="px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                                ← Previous State
                            </button>
                            <button onclick="startGuidedTour(indiaData.findIndex(s => s.id === '${state.id}'))" class="px-4 py-2 text-xs font-bold text-white bg-saffron-500 hover:bg-saffron-600 rounded-xl transition">
                                🧭 Open in Guided Tour
                            </button>
                            <button onclick="navigateState(1)" class="px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                                Next State →
                            </button>
                        </div>

                    </div>
                </div>
            `;
            
            // Scroll main display to top
            document.getElementById('mainDisplay').scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Navigate previous / next state
        function navigateState(direction) {
            const currentIndex = indiaData.findIndex(s => s.id === currentStateId);
            let newIndex = currentIndex + direction;
            if(newIndex < 0) newIndex = indiaData.length - 1;
            if(newIndex >= indiaData.length) newIndex = 0;
            selectState(indiaData[newIndex].id);
        }

        // Update Progress Bar
        function updateProgress() {
            const total = indiaData.length;
            const explored = exploredStates.length;
            const percentage = Math.round((explored / total) * 100);
            
            document.getElementById('progressCount').innerText = `${explored} / ${total} Explored`;
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        // Share State
        function shareState(stateName) {
            const shareText = `Explore ${stateName} on the Incredible India Interactive Tour! Discover capitals, cities, culture, and food from South to North and East to West.`;
            if (navigator.clipboard) {
                document.execCommand('copy'); // Fallback compliance
                // or navigator.clipboard.writeText
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast(`Copied tour info for ${stateName} to clipboard! 📋`);
                }).catch(() => {
                    showToast(`Tour info: ${shareText}`);
                });
            } else {
                showToast(`Tour info: ${shareText}`);
            }
        }

        // Toast Message notification (replaces alert)
        function showToast(message) {
            let toast = document.getElementById('toastNotification');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toastNotification';
                toast.className = 'fixed bottom-6 right-6 z-50 glass-card px-5 py-3 rounded-2xl shadow-2xl border border-saffron-500 text-sm font-bold text-slate-800 dark:text-white transition-all duration-300 transform translate-y-20 opacity-0';
                document.body.appendChild(toast);
            }
            toast.innerText = message;
            setTimeout(() => {
                toast.classList.remove('translate-y-20', 'opacity-0');
            }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        // Guided Tour Modal Management
        function startGuidedTour(index) {
            currentTourIndex = index >= 0 ? index : 0;
            document.getElementById('guidedTourModal').classList.remove('hidden');
            document.getElementById('guidedTourModal').classList.add('flex');
            isTourPlaying = true;
            updateTourPlayButton();
            renderTourStep();
            startTourTimer();
        }

        function closeGuidedTour() {
            document.getElementById('guidedTourModal').classList.remove('flex');
            document.getElementById('guidedTourModal').classList.add('hidden');
            stopTourTimer();
            selectState(indiaData[currentTourIndex].id);
        }

        function startTourTimer() {
            stopTourTimer();
            tourSecondsElapsed = 0;
            
            tourProgressInterval = setInterval(() => {
                if (!isTourPlaying) return;
                tourSecondsElapsed += 0.1;
                const percent = (tourSecondsElapsed / tourStepDuration) * 100;
                const bar = document.getElementById('tourProgressBar');
                if(bar) bar.style.width = `${Math.min(percent, 100)}%`;

                if (tourSecondsElapsed >= tourStepDuration) {
                    tourSecondsElapsed = 0;
                    if (currentTourIndex < indiaData.length - 1) {
                        currentTourIndex++;
                        renderTourStep();
                    } else {
                        currentTourIndex = 0; // Loop or stop
                        renderTourStep();
                    }
                }
            }, 100);
        }

        function stopTourTimer() {
            if (tourProgressInterval) clearInterval(tourProgressInterval);
        }

        function toggleTourPlay() {
            isTourPlaying = !isTourPlaying;
            updateTourPlayButton();
        }

        function updateTourPlayButton() {
            const icon = document.getElementById('tourPlayIcon');
            const text = document.getElementById('tourPlayText');
            if (isTourPlaying) {
                icon.innerText = '⏸️';
                text.innerText = 'Pause';
            } else {
                icon.innerText = '▶️';
                text.innerText = 'Play';
            }
        }

        function nextTourStep() {
            if (currentTourIndex < indiaData.length - 1) {
                currentTourIndex++;
                renderTourStep();
                tourSecondsElapsed = 0;
            } else {
                showToast('🎉 You have completed the grand tour of all 36 regions of India!');
                closeGuidedTour();
            }
        }

        function prevTourStep() {
            if (currentTourIndex > 0) {
                currentTourIndex--;
                renderTourStep();
                tourSecondsElapsed = 0;
            }
        }

        function renderTourStep() {
            const state = indiaData[currentTourIndex];
            document.getElementById('tourStepIndicator').innerText = `Step ${currentTourIndex + 1} of ${indiaData.length} (${state.region})`;
            
            const modalContent = document.getElementById('tourModalContent');
            modalContent.innerHTML = `
                <div class="flex items-center space-x-4">
                    <span class="text-5xl sm:text-6xl">${state.icon}</span>
                    <div>
                        <h3 class="text-2xl font-extrabold text-slate-900 dark:text-white">${state.name}</h3>
                        <p class="text-xs sm:text-sm text-saffron-500 font-bold">${state.tagline}</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Capital: <strong>${state.capital}</strong></p>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm">
                    <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/80">
                        <strong class="text-saffron-500 block mb-1">🎭 Culture</strong>
                        <p class="text-slate-600 dark:text-slate-300 line-clamp-3">${state.culture}</p>
                    </div>
                    <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/80">
                        <strong class="text-emerald-500 block mb-1">🍲 Special Food</strong>
                        <p class="text-slate-600 dark:text-slate-300 line-clamp-3">${state.food}</p>
                    </div>
                </div>
                <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">Key Cities:</span>
                    <div class="flex flex-wrap gap-1.5">
                        ${state.majorCities.map(c => `<span class="px-2.5 py-1 rounded-lg text-xs bg-slate-200 dark:bg-slate-700">${c}</span>`).join('')}
                    </div>
                </div>
            `;

            document.getElementById('prevTourBtn').disabled = currentTourIndex === 0;
            document.getElementById('nextTourBtn').innerText = currentTourIndex === indiaData.length - 1 ? 'Finish Tour 🏁' : 'Next Stop →';
        }
    </script>
</body>
</html>
