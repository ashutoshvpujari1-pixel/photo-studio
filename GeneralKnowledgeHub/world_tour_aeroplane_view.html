<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Paths from India to the World - Educational View</title>
  <!-- Load Globe.gl and dependencies -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-81X622TYDG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-81X622TYDG');
</script>


  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }
    #globeContainer {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
    .ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 16px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    select:hover {
      border-color: #38bdf8;
    }
    .stats-card {
      background: rgba(30, 41, 59, 0.6);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .stat-row:last-child {
      margin-bottom: 0;
    }
    .stat-label {
      color: #94a3b8;
    }
    .stat-value {
      font-weight: 600;
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="ui-panel">
    <h1>🇮🇳 India Flight Routes</h1>
    <p class="subtitle">Explore great-circle aviation paths from New Delhi to world destinations.</p>
    
    <label for="countrySelect">Select Destination Country:</label>
    <select id="countrySelect"></select>

    <div class="stats-card" id="statsCard">
      <div class="stat-row">
        <span class="stat-label">Destination:</span>
        <span class="stat-value" id="destName">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Great-Circle Distance:</span>
        <span class="stat-value" id="destDist">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Est. Flight Time:</span>
        <span class="stat-value" id="destTime">-</span>
      </div>
    </div>
  </div>

  <div id="globeContainer"></div>

  <script>
    // India Hub (New Delhi)
    const INDIA_HUB = { name: "New Delhi, India", lat: 28.6139, lng: 77.2090 };

    // Representative dataset spanning global regions (expandable to all 195 nations)
    const destinations = [
      { name: "United States", capital: "Washington, D.C.", lat: 38.8951, lng: -77.0364 },
      { name: "United Kingdom", capital: "London", lat: 51.5074, lng: -0.1278 },
      { name: "United Arab Emirates", capital: "Dubai / Abu Dhabi", lat: 25.2048, lng: 55.2708 },
      { name: "Japan", capital: "Tokyo", lat: 35.6762, lng: 139.6503 },
      { name: "Australia", capital: "Canberra", lat: -35.2809, lng: 149.1300 },
      { name: "France", capital: "Paris", lat: 48.8566, lng: 2.3522 },
      { name: "Germany", capital: "Berlin", lat: 52.5200, lng: 13.4050 },
      { name: "Canada", capital: "Ottawa", lat: 45.4215, lng: -75.6972 },
      { name: "Singapore", capital: "Singapore", lat: 1.3521, lng: 103.8198 },
      { name: "South Africa", capital: "Pretoria", lat: -25.7479, lng: 28.2293 },
      { name: "Brazil", capital: "Brasília", lat: -15.7975, lng: -47.8919 },
      { name: "Russia", capital: "Moscow", lat: 55.7558, lng: 37.6173 },
      { name: "China", capital: "Beijing", lat: 39.9042, lng: 116.4074 },
      { name: "Egypt", capital: "Cairo", lat: 30.0444, lng: 31.2357 },
      { name: "South Korea", capital: "Seoul", lat: 37.5665, lng: 126.9780 },
      { name: "Italy", capital: "Rome", lat: 41.9028, lng: 12.4964 },
      { name: "Saudi Arabia", capital: "Riyadh", lat: 24.7136, lng: 46.6753 },
      { name: "Thailand", capital: "Bangkok", lat: 13.7563, lng: 100.5018 },
      { name: "New Zealand", capital: "Wellington", lat: -41.2865, lng: 174.7762 },
      { name: "Argentina", capital: "Buenos Aires", lat: -34.6037, lng: -58.3816 }
    ];

    // Populate dropdown
    const selectEl = document.getElementById('countrySelect');
    destinations.sort((a, b) => a.name.localeCompare(b.name)).forEach((dest, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = dest.name + ` (${dest.capital})`;
      selectEl.appendChild(opt);
    });

    // Initialize Globe
    const globe = Globe()
      (document.getElementById('globeContainer'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png');

    // Add India marker
    const pointsData = [
      { lat: INDIA_HUB.lat, lng: INDIA_HUB.lng, size: 0.8, color: '#38bdf8', label: INDIA_HUB.name }
    ];

    globe
      .pointsData(pointsData)
      .pointLat('lat')
      .pointLng('lng')
      .pointColor('color')
      .pointAltitude(0.02)
      .pointRadius('size');

    // Helper: Calculate great circle distance in km
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    // Update flight path when selection changes
    function updateFlightRoute(index) {
      const dest = destinations[index];
      const distKm = calculateDistance(INDIA_HUB.lat, INDIA_HUB.lng, dest.lat, dest.lng);
      // Average commercial airliner speed ~850 km/h
      const flightHours = (distKm / 850).toFixed(1);

      // Update UI stats
      document.getElementById('destName').textContent = `${dest.name} (${dest.capital})`;
      document.getElementById('destDist').textContent = `${distKm.toLocaleString()} km`;
      document.getElementById('destTime').textContent = `~${flightHours} hours`;

      // Set up Arc data (Curved flight path)
      const arcsData = [{
        startLat: INDIA_HUB.lat,
        startLng: INDIA_HUB.lng,
        endLat: dest.lat,
        endLng: dest.lng,
        color: ['#38bdf8', '#f43f5e']
      }];

      globe.arcsData(arcsData)
        .arcColor('color')
        .arcDashLength(0.4)
        .arcDashGap(0.2)
        .arcDashInitialGap(() => Math.random())
        .arcDashSpeed(0.5)
        .arcAltitude(0.25); // Gives the realistic arched trajectory over the globe

      // Update Destination Marker
      globe.pointsData([
        { lat: INDIA_HUB.lat, lng: INDIA_HUB.lng, size: 0.8, color: '#38bdf8', label: 'New Delhi' },
        { lat: dest.lat, lng: dest.lng, size: 0.8, color: '#f43f5e', label: dest.capital }
      ]);

      // Focus camera on destination/arc midpoint
      globe.pointOfView({ lat: (INDIA_HUB.lat + dest.lat)/2, lng: (INDIA_HUB.lng + dest.lng)/2, altitude: 2.0 }, 1500);
    }

    selectEl.addEventListener('change', (e) => {
      updateFlightRoute(e.target.value);
    });

    // Initial load
    selectEl.value = 0;
    updateFlightRoute(0);

    // Enable auto-rotation when idle
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.5;
  </script>
</body>
</html>
