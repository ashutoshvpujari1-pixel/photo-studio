<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Photo Collage Studio Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF CDN for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- html2canvas CDN for rendering collage to image/PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-81X622TYDG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-81X622TYDG');
</script>


</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <div class="max-w-5xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight mb-2">
                <i class="fa-solid fa-photo-film text-indigo-600 mr-2"></i> Photo Collage Studio Pro
            </h1>
            <p class="text-slate-600">Customize layouts, spacing, background colors, and photo borders with zero image cropping.</p>
        </header>

        <!-- Main Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8">
            
            <!-- Upload Section -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Select Photos (Multiple)</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-500 mb-2"></i>
                            <p class="mb-1 text-sm text-slate-600"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                            <p class="text-xs text-slate-500">PNG, JPG, WEBP</p>
                        </div>
                        <input type="file" id="imageUpload" multiple accept="image/*" class="hidden" />
                    </label>
                </div>
            </div>

            <!-- Uploaded Thumbnails Preview -->
            <div id="previewContainer" class="hidden mb-6">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-semibold text-slate-700">Uploaded Images (<span id="imageCount">0</span>)</span>
                    <button id="clearAllBtn" class="text-xs text-rose-600 hover:text-rose-800 font-medium">Clear All</button>
                </div>
                <div id="thumbnailsList" class="flex gap-3 overflow-x-auto pb-2"></div>
            </div>

            <!-- Customization Controls Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
                <!-- Layout Template -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5"><i class="fa-solid fa-table-cells text-indigo-600 mr-1"></i> Layout Template</label>
                    <select id="layoutTemplate" class="w-full bg-white border border-slate-300 rounded-lg p-2 text-xs text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="equal">Equal Grid</option>
                        <option value="featured">Featured Hero</option>
                        <option value="cols2">2 Columns</option>
                        <option value="cols3">3 Columns</option>
                    </select>
                </div>

                <!-- Spacing Control -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold text-slate-700"><i class="fa-solid fa-sliders text-indigo-600 mr-1"></i> Spacing</label>
                        <span id="spacingValue" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">12px</span>
                    </div>
                    <input type="range" id="spacingRange" min="0" max="32" value="12" step="4" class="w-full accent-indigo-600 cursor-pointer mt-1">
                </div>

                <!-- Background Color -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5"><i class="fa-solid fa-palette text-indigo-600 mr-1"></i> Canvas Background</label>
                    <select id="bgColor" class="w-full bg-white border border-slate-300 rounded-lg p-2 text-xs text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="#ffffff">Clean White</option>
                        <option value="#0f172a">Dark Slate</option>
                        <option value="#f8fafc">Light Gray</option>
                        <option value="#fdf2f8">Soft Pink</option>
                        <option value="#fefce8">Soft Yellow</option>
                        <option value="#f0fdf4">Soft Mint</option>
                    </select>
                </div>

                <!-- Photo Border Customization -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold text-slate-700"><i class="fa-solid fa-border-all text-indigo-600 mr-1"></i> Photo Frame</label>
                        <span id="borderWidthVal" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">4px</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="range" id="borderWidthRange" min="0" max="16" value="4" step="2" class="w-full accent-indigo-600 cursor-pointer mt-1">
                        <input type="color" id="borderColorPicker" value="#ffffff" class="w-8 h-7 rounded border border-slate-300 cursor-pointer bg-white">
                    </div>
                </div>
            </div>

            <!-- Additional Corners Control -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold text-slate-700"><i class="fa-solid fa-circle-notch text-indigo-600 mr-1"></i> Corner Rounding (Radius)</label>
                        <span id="borderRadiusVal" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">8px</span>
                    </div>
                    <input type="range" id="borderRadiusRange" min="0" max="32" value="8" step="4" class="w-full accent-indigo-600 cursor-pointer mt-1">
                </div>
                <div class="flex items-end">
                    <button id="generateBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold py-2.5 px-6 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Collage
                    </button>
                </div>
            </div>
        </div>

        <!-- Collage Output Section -->
        <div id="outputSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
            <h2 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-images text-indigo-600"></i> Your Collage Result
            </h2>

            <!-- Collage Canvas Wrapper -->
            <div id="collageOuterWrapper" class="bg-slate-100 p-6 rounded-xl border border-slate-200 mb-6 flex items-center justify-center overflow-hidden transition-colors">
                <div id="collageContainer" class="w-full max-w-3xl p-4 rounded-xl shadow-inner grid">
                    <!-- Dynamic Grid Items will be injected here -->
                </div>
            </div>

            <!-- Action Toolbar -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button id="downloadImgBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-download"></i> Download Image
                </button>
                <button id="downloadPdfBtn" class="bg-rose-600 hover:bg-rose-700 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-file-pdf"></i> Download PDF
                </button>
                <button id="copyBtn" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-copy"></i> Copy Image
                </button>
                <button id="shareBtn" class="bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-share-nodes"></i> Share / Email
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let uploadedFiles = [];

        const imageUpload = document.getElementById('imageUpload');
        const previewContainer = document.getElementById('previewContainer');
        const thumbnailsList = document.getElementById('thumbnailsList');
        const imageCount = document.getElementById('imageCount');
        const generateBtn = document.getElementById('generateBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const outputSection = document.getElementById('outputSection');
        const collageContainer = document.getElementById('collageContainer');
        const collageOuterWrapper = document.getElementById('collageOuterWrapper');
        
        const layoutTemplate = document.getElementById('layoutTemplate');
        const spacingRange = document.getElementById('spacingRange');
        const spacingValue = document.getElementById('spacingValue');
        const bgColor = document.getElementById('bgColor');
        
        const borderWidthRange = document.getElementById('borderWidthRange');
        const borderWidthVal = document.getElementById('borderWidthVal');
        const borderColorPicker = document.getElementById('borderColorPicker');
        const borderRadiusRange = document.getElementById('borderRadiusRange');
        const borderRadiusVal = document.getElementById('borderRadiusVal');

        const downloadImgBtn = document.getElementById('downloadImgBtn');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');
        const copyBtn = document.getElementById('copyBtn');
        const shareBtn = document.getElementById('shareBtn');

        // Live UI value indicators
        spacingRange.addEventListener('input', (e) => {
            spacingValue.textContent = `${e.target.value}px`;
            if (!outputSection.classList.contains('hidden')) collageContainer.style.gap = `${e.target.value}px`;
        });
        borderWidthRange.addEventListener('input', (e) => {
            borderWidthVal.textContent = `${e.target.value}px`;
            updateCollageStylesLive();
        });
        borderColorPicker.addEventListener('input', () => updateCollageStylesLive());
        borderRadiusRange.addEventListener('input', (e) => {
            borderRadiusVal.textContent = `${e.target.value}px`;
            updateCollageStylesLive();
        });
        bgColor.addEventListener('change', (e) => {
            collageContainer.style.backgroundColor = e.target.value;
        });

        function updateCollageStylesLive() {
            if (outputSection.classList.contains('hidden')) return;
            const borderWidth = borderWidthRange.value + 'px';
            const borderColor = borderColorPicker.value;
            const borderRadius = borderRadiusRange.value + 'px';

            const items = collageContainer.querySelectorAll('.collage-item');
            items.forEach(item => {
                item.style.border = `${borderWidth} solid ${borderColor}`;
                item.style.borderRadius = borderRadius;
            });
        }

        // Handle File Selection
        imageUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    uploadedFiles.push(file);
                }
            });
            updateUI();
            imageUpload.value = '';
        });

        clearAllBtn.addEventListener('click', () => {
            uploadedFiles = [];
            updateUI();
            outputSection.classList.add('hidden');
        });

        function updateUI() {
            if (uploadedFiles.length > 0) {
                previewContainer.classList.remove('hidden');
                generateBtn.disabled = false;
                imageCount.textContent = uploadedFiles.length;
                
                thumbnailsList.innerHTML = '';
                uploadedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const div = document.createElement('div');
                        div.className = 'relative w-20 h-20 flex-shrink-0 rounded-lg overflow-hidden border border-slate-200 group';
                        div.innerHTML = `
                            <img src="${e.target.result}" class="w-full h-full object-cover">
                            <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        `;
                        thumbnailsList.appendChild(div);
                    };
                    reader.readAsDataURL(file);
                });
            } else {
                previewContainer.classList.add('hidden');
                generateBtn.disabled = true;
            }
        }

        window.removeImage = function(index) {
            uploadedFiles.splice(index, 1);
            updateUI();
            if(uploadedFiles.length === 0) {
                outputSection.classList.add('hidden');
            }
        };

        // Generate Collage with all Pro Customizations
        generateBtn.addEventListener('click', () => {
            if (uploadedFiles.length === 0) return;

            collageContainer.innerHTML = '';
            const template = layoutTemplate.value;
            const gapSize = spacingRange.value;
            const bgVal = bgColor.value;
            const borderWidth = borderWidthRange.value + 'px';
            const borderColor = borderColorPicker.value;
            const borderRadius = borderRadiusRange.value + 'px';

            collageContainer.style.gap = `${gapSize}px`;
            collageContainer.style.backgroundColor = bgVal;

            let gridColsClass = 'grid-cols-2 md:grid-cols-3';
            if (template === 'cols2') gridColsClass = 'grid-cols-2';
            if (template === 'cols3') gridColsClass = 'grid-cols-3';
            if (template === 'equal') {
                if (uploadedFiles.length === 1) gridColsClass = 'grid-cols-1';
                else if (uploadedFiles.length === 2) gridColsClass = 'grid-cols-2';
                else gridColsClass = 'grid-cols-2 sm:grid-cols-3';
            }

            collageContainer.className = `w-full max-w-3xl p-4 rounded-xl shadow-inner grid ${gridColsClass} items-center justify-center transition-colors`;

            uploadedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'collage-item bg-black/5 overflow-hidden flex items-center justify-center shadow-sm aspect-square transition-all';
                    itemDiv.style.border = `${borderWidth} solid ${borderColor}`;
                    itemDiv.style.borderRadius = borderRadius;

                    if (template === 'featured' && index === 0 && uploadedFiles.length > 2) {
                        itemDiv.className += ' col-span-2 row-span-2 aspect-[16/9]';
                    }

                    itemDiv.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-full object-contain">
                    `;
                    collageContainer.appendChild(itemDiv);
                };
                reader.readAsDataURL(file);
            });

            outputSection.classList.remove('hidden');
            outputSection.scrollIntoView({ behavior: 'smooth' });
        });

        // Export as Image (PNG)
        downloadImgBtn.addEventListener('click', () => {
            html2canvas(collageContainer, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'photo-collage.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });

        // Export as PDF
        downloadPdfBtn.addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            html2canvas(collageContainer, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF({
                    orientation: canvas.width > canvas.height ? 'l' : 'p',
                    unit: 'mm',
                    format: 'a4'
                });
                
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                
                const imgWidth = pageWidth - 20;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, Math.min(imgHeight, pageHeight - 20));
                pdf.save('photo-collage.pdf');
            });
        });

        // Copy to Clipboard
        copyBtn.addEventListener('click', () => {
            html2canvas(collageContainer, { scale: 2 }).then(canvas => {
                canvas.toBlob(blob => {
                    try {
                        navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        alert('Collage copied to clipboard!');
                    } catch (err) {
                        alert('Clipboard copy not supported in your browser.');
                    }
                });
            });
        });

        // Share or Email
        shareBtn.addEventListener('click', async () => {
            html2canvas(collageContainer, { scale: 2 }).then(async canvas => {
                canvas.toBlob(async blob => {
                    const file = new File([blob], 'collage.png', { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: 'My Photo Collage',
                                text: 'Check out this photo collage I created!',
                                files: [file]
                            });
                        } catch (err) {
                            if (err.name !== 'AbortError') console.log(err);
                        }
                    } else {
                        const emailBody = encodeURIComponent('Check out my photo collage! (Download the image from the app to attach it).');
                        window.location.href = `mailto:?subject=My Photo Collage&body=${emailBody}`;
                    }
                });
            });
        });
    </script>
</body>
</html>
