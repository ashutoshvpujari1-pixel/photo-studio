
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Photo Presentation Studio</title>
<meta name="description" content="Upload your photo and transform it into a beautiful floating 3D photo presentation with animated effects and fullscreen display.">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-81X622TYDG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-81X622TYDG');
</script>


<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10172b;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
    background: linear-gradient(120deg,#141e46,#312e81,#581c87);
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    color: #d8dafa;
    margin-bottom: 0;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 20px;
    background: #18223a;
}

input, select, button {
    padding: 12px 16px;
    border-radius: 9px;
    border: none;
    font-size: 14px;
}

input[type=file] {
    background: white;
    color: #222;
    max-width: 260px;
}

button {
    cursor: pointer;
    color: white;
    font-weight: bold;
    background: #6366f1;
    transition: .3s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.2);
}

.generate { background: #059669; }
.present { background: #e87916; }
.fullscreen { background: #2563eb; }
.stop { background: #dc2626; }

select {
    background: white;
    color: #222;
}

.stage {
    min-height: 600px;
    height: calc(100vh - 190px);
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    background:
      radial-gradient(circle at 50% 40%,#334477,#10172b 70%);
    transition: background 0.5s;
}

.stage.theme-purple {
    background: radial-gradient(circle,#642a85,#160c2c 75%);
}

.stage.theme-black {
    background: radial-gradient(circle,#343434,#050505 75%);
}

.stage.theme-blue {
    background: radial-gradient(circle,#155e9b,#07152e 75%);
}

.stage.theme-sunset {
    background: radial-gradient(circle,#a84a4a,#28102e 75%);
}

.placeholder {
    color: #cbd5e1;
    text-align: center;
    padding: 20px;
}

.placeholder .symbol {
    font-size: 75px;
}

.photo-container {
    position: relative;
    display: none;
    max-width: 85%;
    max-height: 80%;
    animation: appear 1.2s ease forwards;
    transform-style: preserve-3d;
}

.photo-container.show {
    display: block;
}

.photo-frame {
    position: relative;
    padding: 13px;
    background: linear-gradient(145deg,#ffffff,#cbd5e1,#ffffff);
    border-radius: 15px;
    box-shadow:
        0 35px 65px rgba(0,0,0,.65),
        0 0 35px rgba(147,197,253,.35),
        inset 0 0 8px white;
    transform-style: preserve-3d;
}

.photo-frame img {
    display: block;
    max-width: min(75vw,850px);
    max-height: 62vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 5px;
}

.photo-caption {
    color: #334155;
    text-align: center;
    padding: 9px 4px 0;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: bold;
}

.photo-container.floating {
    animation: floatPhoto 5s ease-in-out infinite;
}

.photo-container.presenting {
    animation: presentation 8s ease-in-out infinite;
}

.photo-container.presenting .photo-frame {
    animation: frameGlow 3s ease-in-out infinite alternate;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.4) rotateY(35deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotateY(0);
    }
}

@keyframes floatPhoto {
    0%,100% {
        transform: translateY(0) rotateX(3deg) rotateY(-5deg);
    }
    50% {
        transform: translateY(-35px) rotateX(-3deg) rotateY(5deg);
    }
}

@keyframes presentation {
    0% {
        transform: translate(-25px,10px) rotateY(-8deg) scale(.92);
    }
    25% {
        transform: translate(20px,-25px) rotateY(5deg) scale(1.04);
    }
    50% {
        transform: translate(25px,10px) rotateY(8deg) scale(.98);
    }
    75% {
        transform: translate(-20px,-20px) rotateY(-5deg) scale(1.03);
    }
    100% {
        transform: translate(-25px,10px) rotateY(-8deg) scale(.92);
    }
}

@keyframes frameGlow {
    from {
        box-shadow: 0 30px 55px rgba(0,0,0,.6),
                    0 0 15px rgba(96,165,250,.4);
    }
    to {
        box-shadow: 0 35px 70px rgba(0,0,0,.7),
                    0 0 45px rgba(192,132,252,.8);
    }
}

.fullscreen-active {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
}

.fullscreen-active .stage {
    height: 100vh;
    min-height: 100vh;
}

.fullscreen-active .photo-frame img {
    max-height: 75vh;
    max-width: 85vw;
}

.fullscreen-active header,
.fullscreen-active .controls,
.fullscreen-active footer {
    display: none;
}

.hint {
    position: absolute;
    bottom: 15px;
    color: #a5b4fc;
    font-size: 12px;
}

footer {
    text-align: center;
    padding: 15px;
    color: #94a3b8;
    font-size: 12px;
}

@media(max-width:600px) {
    header h1 { font-size: 21px; }
    .stage { min-height: 450px; }
    .controls { gap: 8px; }
    input,select,button { font-size: 12px; }
    .photo-frame { padding: 7px; }
}
</style>
</head>

<body>

<div id="app">

<header>
    <h1>✨ Floating Photo Presentation Studio</h1>
    <p>Transform your photographs into beautiful floating presentations</p>
</header>

<div class="controls">

    <input type="file" id="photoInput" accept="image/*">

    <button class="generate" onclick="generatePhoto()">
        ✨ Generate
    </button>

    <button class="present" onclick="togglePresentation()" id="presentBtn">
        ▶ Start Presentation
    </button>

    <button class="fullscreen" onclick="toggleFullscreen()">
        ⛶ Full Screen
    </button>

    <button class="stop" onclick="stopPresentation()">
        ■ Stop
    </button>

    <select id="theme" onchange="changeTheme()">
        <option value="">Default Background</option>
        <option value="theme-purple">Purple Theme</option>
        <option value="theme-black">Black Theme</option>
        <option value="theme-blue">Blue Theme</option>
        <option value="theme-sunset">Sunset Theme</option>
    </select>

    <select id="speed" onchange="changeSpeed()">
        <option value="8">Slow Animation</option>
        <option value="5" selected>Normal Animation</option>
        <option value="3">Fast Animation</option>
    </select>

</div>

<div class="stage" id="stage">

    <div class="placeholder" id="placeholder">
        <div class="symbol">🖼️</div>
        <h2>Your Photo Will Float Here</h2>
        <p>Upload a photo and click Generate to begin.</p>
    </div>

    <div class="photo-container" id="photoContainer">
        <div class="photo-frame">
            <img id="displayPhoto" alt="Floating presentation photo">
            <div class="photo-caption"></div>
        </div>
    </div>

    <div class="hint" id="hint">
        Upload your photo to start your experience
    </div>

</div>

<footer>
    Floating Photo Presentation Studio | Created with HTML, CSS & JavaScript
</footer>

</div>

<script>

const photoInput = document.getElementById("photoInput");
const photoContainer = document.getElementById("photoContainer");
const displayPhoto = document.getElementById("displayPhoto");
const placeholder = document.getElementById("placeholder");
const stage = document.getElementById("stage");
const presentBtn = document.getElementById("presentBtn");

let currentPhotoURL = null;
let isPresenting = false;

photoInput.addEventListener("change", function() {
    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Please select a valid image.");
        this.value = "";
        return;
    }

    if (currentPhotoURL) {
        URL.revokeObjectURL(currentPhotoURL);
    }

    currentPhotoURL = URL.createObjectURL(file);
    displayPhoto.src = currentPhotoURL;

    displayPhoto.onload = function() {
        generatePhoto();
    };
});

function generatePhoto() {

    if (!photoInput.files.length) {
        alert("Please upload a photo first!");
        return;
    }

    stopPresentation();

    placeholder.style.display = "none";

    photoContainer.classList.remove("presenting");
    photoContainer.classList.remove("floating");

    // Restart entrance animation
    void photoContainer.offsetWidth;

    photoContainer.classList.add("show");
    photoContainer.classList.add("floating");

    document.getElementById("hint").textContent =
        "";
}

function togglePresentation() {

    if (!photoInput.files.length) {
        alert("Please upload and generate a photo first!");
        return;
    }

    if (isPresenting) {
        stopPresentation();
        return;
    }

    isPresenting = true;

    photoContainer.classList.remove("floating");
    photoContainer.classList.add("presenting");

    photoContainer.style.animationDuration =
        document.getElementById("speed").value + "s";

    presentBtn.innerHTML = "⏸ Pause Presentation";
    document.getElementById("hint").textContent =
        "🎬 Presentation Running...";
}

function stopPresentation() {

    isPresenting = false;

    photoContainer.classList.remove("presenting");

    if (photoContainer.classList.contains("show")) {
        photoContainer.classList.add("floating");
    }

    presentBtn.innerHTML = "▶ Start Presentation";

    document.getElementById("hint").textContent =
        "Presentation stopped. Your photo is ready.";
}

function changeTheme() {

    stage.className = "stage";

    const selected = document.getElementById("theme").value;

    if (selected) {
        stage.classList.add(selected);
    }
}

function changeSpeed() {

    const speed = document.getElementById("speed").value;

    photoContainer.style.animationDuration = speed + "s";
}

async function toggleFullscreen() {

    const app = document.getElementById("app");

    try {
        if (!document.fullscreenElement) {
            await app.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        alert("Full screen is not supported by this browser.");
    }
}

document.addEventListener("fullscreenchange", function() {

    const app = document.getElementById("app");

    if (document.fullscreenElement) {
        app.classList.add("fullscreen-active");
    } else {
        app.classList.remove("fullscreen-active");
    }

});

// ESC automatically exits fullscreen through browser API.
// This also handles fullscreen exit from browser controls.

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        if (document.fullscreenElement) {
            document.exitFullscreen();
        }
    }

});

window.addEventListener("beforeunload", function() {
    if (currentPhotoURL) {
        URL.revokeObjectURL(currentPhotoURL);
    }
});

</script>

</body>
</html>
