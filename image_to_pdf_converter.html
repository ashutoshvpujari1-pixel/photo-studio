<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-81X622TYDG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-81X622TYDG');
</script>

</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl w-full max-w-2xl p-6 md:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Image to PDF Converter</h1>
            <p class="text-slate-500 text-sm mt-1">Upload your images, generate a PDF, and download, share, or email instantly.</p>
        </div>

        <!-- Upload Dropzone -->
        <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-indigo-500 transition-colors cursor-pointer relative" id="drop-zone">
            <input type="file" id="image-input" multiple accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            <div class="flex flex-col items-center pointer-events-none">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-500 mb-3"></i>
                <p class="text-slate-700 font-medium">Drag & drop images here, or <span class="text-indigo-600 underline">browse</span></p>
                <p class="text-slate-400 text-xs mt-1">Supports PNG, JPG, JPEG, WEBP (Multiple allowed)</p>
            </div>
        </div>

        <!-- Preview Container -->
        <div id="preview-container" class="mt-6 grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-60 overflow-y-auto p-2 hidden">
            <!-- Dynamic thumbnails go here -->
        </div>

        <!-- Action Button: Generate PDF -->
        <div class="mt-6">
            <button id="generate-btn" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                <i class="fa-solid fa-file-pdf"></i> Generate To PDF Format
            </button>
        </div>

        <!-- Secondary Actions (Download, Share, Email) - Hidden until generated -->
        <div id="action-buttons" class="mt-6 border-t pt-6 hidden flex flex-col sm:flex-row gap-3">
            <button id="download-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
                <i class="fa-solid fa-download"></i> Download PDF
            </button>
            <button id="share-btn" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
                <i class="fa-solid fa-share-nodes"></i> Share PDF
            </button>
            <button id="email-btn" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
                <i class="fa-solid fa-envelope"></i> Email PDF
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let uploadedFiles = [];
        let generatedPdfBlob = null;
        let generatedPdfFileName = "converted-document.pdf";

        const imageInput = document.getElementById('image-input');
        const previewContainer = document.getElementById('preview-container');
        const generateBtn = document.getElementById('generate-btn');
        const actionButtons = document.getElementById('action-buttons');
        const downloadBtn = document.getElementById('download-btn');
        const shareBtn = document.getElementById('share-btn');
        const emailBtn = document.getElementById('email-btn');

        // Handle File Selection
        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            uploadedFiles = files;
            renderPreviews();
            generateBtn.disabled = false;
            actionButtons.classList.add('hidden'); // Hide post-actions if new files are picked
        });

        // Render Image Previews
        function renderPreviews() {
            previewContainer.innerHTML = '';
            previewContainer.classList.remove('hidden');

            uploadedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'relative group bg-slate-100 rounded-lg overflow-hidden border border-slate-200 aspect-square flex items-center justify-center';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="object-cover w-full h-full">
                        <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs opacity-80 hover:opacity-100 shadow">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    `;
                    previewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        // Remove Single Image from Array
        window.removeImage = function(index) {
            uploadedFiles.splice(index, 1);
            if (uploadedFiles.length === 0) {
                previewContainer.classList.add('hidden');
                generateBtn.disabled = true;
                actionButtons.classList.add('hidden');
            } else {
                renderPreviews();
            }
        };

        // Generate PDF Click Handler
        generateBtn.addEventListener('click', async () => {
            if (uploadedFiles.length === 0) return;

            generateBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating PDF...`;
            generateBtn.disabled = true;

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                for (let i = 0; i < uploadedFiles.length; i++) {
                    const file = uploadedFiles[i];
                    const dataUrl = await readFileAsDataURL(file);
                    
                    // Get image dimensions to scale proportionally onto PDF page
                    const img = await loadImage(dataUrl);
                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    
                    const ratio = Math.min(pageWidth / img.width, pageHeight / img.height);
                    const imgWidth = img.width * ratio;
                    const imgHeight = img.height * ratio;
                    
                    // Center the image on the page
                    const x = (pageWidth - imgWidth) / 2;
                    const y = (pageHeight - imgHeight) / 2;

                    if (i > 0) {
                        doc.addPage();
                    }
                    
                    // Determine image format type
                    let format = 'JPEG';
                    if (file.type === 'image/png') format = 'PNG';
                    if (file.type === 'image/webp') format = 'WEBP';

                    doc.addImage(dataUrl, format, x, y, imgWidth, imgHeight);
                }

                // Output as Blob
                generatedPdfBlob = doc.output('blob');
                
                // Show success options
                actionButtons.classList.remove('hidden');
                generateBtn.innerHTML = `<i class="fa-solid fa-check"></i> PDF Generated Successfully!`;
                
                setTimeout(() => {
                    generateBtn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> Generate To PDF Format`;
                    generateBtn.disabled = false;
                }, 2000);

            } catch (error) {
                console.error(error);
                alert('An error occurred while generating the PDF.');
                generateBtn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> Generate To PDF Format`;
                generateBtn.disabled = false;
            }
        });

        // Helper: Read file as Data URL
        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Helper: Load image element to read dimensions
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        // 1. Download PDF
        downloadBtn.addEventListener('click', () => {
            if (!generatedPdfBlob) return;
            const link = document.createElement('a');
            link.href = URL.createObjectURL(generatedPdfBlob);
            link.download = generatedPdfFileName;
            link.click();
        });

        // 2. Share PDF (Uses Web Share API if available)
        shareBtn.addEventListener('click', async () => {
            if (!generatedPdfBlob) return;
            const file = new File([generatedPdfBlob], generatedPdfFileName, { type: 'application/pdf' });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: 'Converted Images PDF',
                        text: 'Here is the PDF generated from images.',
                        files: [file],
                    });
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.error('Sharing failed', error);
                    }
                }
            } else {
                alert('Web Share API for files is not supported on this browser/device. Please use the Download button instead.');
            }
        });

        // 3. Email PDF
        emailBtn.addEventListener('click', () => {
            if (!generatedPdfBlob) return;
            
            // Browsers don't allow automatic attachment via mailto for security reasons. 
            // Best practice: Trigger download + open mail client prompt.
            const link = document.createElement('a');
            link.href = URL.createObjectURL(generatedPdfBlob);
            link.download = generatedPdfFileName;
            link.click();

            const subject = encodeURIComponent("Here is your converted PDF file");
            const body = encodeURIComponent("Hi,\n\nI have generated a PDF from images. Please find the downloaded file attached to your device's downloads folder.\n\nBest regards,");
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        });
    </script>
</body>
</html>
